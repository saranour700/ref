contract:
  name: product_ingestion
  version: 1.1.0
  description: Ingest standardized retailer product data from the retailer adapter into the Reference DB pipeline

input:
  source:
    type: retailer_adapter
    description: Standardized product data produced by a retailer adapter according to the retailer adapter contract

output:
  dataset: raw_products
  grain: one record per retailer product
  columns:
    - product_id
    - retailer_product_id
    - product_name
    - brand
    - retailer
    - private_label
    - upc
    - category
    - size
    - price
    - price_currency
    - is_available
    - image_url
    - product_url
    - source_url
    - source
    - scraped_at

keys:
  primary_key:
    - retailer
    - retailer_product_id

constraints:
  required:
    - retailer_product_id
    - product_name
    - retailer
    - source_url
    - source
    - scraped_at

  nullable:
    - product_id
    - brand
    - private_label
    - upc
    - category
    - size
    - price
    - price_currency
    - is_available
    - image_url
    - product_url

  uniqueness:
    - retailer
    - retailer_product_id

processing:
  does:
    - receive_standardized_data_from_retailer_adapter
    - preserve_source_identifiers
    - preserve_source_values
    - preserve_source_provenance
    - attach_retailer
    - load_products_into_raw_layer
    - detect_new_products_using_retailer_product_id

  does_not:
    - normalize_product_identity
    - classify_products
    - assign_taxonomy
    - create_product_groups
    - create_variants
    - calculate_scores
    - perform_entity_resolution
    - detect_product_updates
    - detect_product_deletes
    - invent_missing_values

quality:
  critical:
    - missing_retailer_product_id
    - missing_retailer
    - missing_product_name
    - missing_source_url
    - missing_source
    - missing_scraped_at
    - duplicate_retailer_product_id_within_retailer

  warnings:
    - missing_brand
    - missing_upc
    - missing_size
    - missing_price
    - missing_image_url
    - missing_product_url

failure_handling:
  statuses:
    PASS: continue
    WARNING: continue_and_report
    AMBIGUOUS: quarantine_for_review
    FAIL: stop

versioning:
  schema_version: 1.1.0
  rules_version: 1.0.0

lineage:
  source: retailer_adapter
