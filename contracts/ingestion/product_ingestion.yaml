contract:
  name: product_ingestion
  version: 1.0.0
  description: Ingest raw retailer product data into the Reference DB pipeline

input:
  source:
    type: retailer
    description: Raw product data produced by a retailer adapter

output:
  dataset: raw_products
  grain: one record per retailer product
  columns:
    - external_id
    - source_retailer
    - title
    - brand
    - barcode
    - description
    - ingredients_text
    - nutrition_text
    - image_url
    - size_amount
    - size_unit
    - price
    - currency
    - scraped_at

keys:
  primary_key:
    - source_retailer
    - external_id

constraints:
  required:
    - external_id
    - source_retailer
    - title

  nullable:
    - brand
    - barcode
    - description
    - ingredients_text
    - nutrition_text
    - image_url
    - size_amount
    - size_unit
    - price
    - currency
    - scraped_at

  uniqueness:
    - source_retailer
    - external_id

processing:
  does:
    - receive_data_from_retailer_adapter
    - preserve_source_identifiers
    - preserve_source_values
    - attach_source_retailer

  does_not:
    - normalize_product_identity
    - classify_products
    - assign_taxonomy
    - create_product_groups
    - create_variants
    - calculate_scores
    - invent_missing_values

quality:
  critical:
    - missing_external_id
    - missing_source_retailer
    - missing_title
    - duplicate_external_id_within_retailer

  warnings:
    - missing_brand
    - missing_barcode
    - missing_size
    - missing_description
    - missing_nutrition

failure_handling:
  statuses:
    PASS: continue
    WARNING: continue_and_report
    AMBIGUOUS: quarantine_for_review
    FAIL: stop

versioning:
  schema_version: 1.0.0
  rules_version: 1.0.0

lineage:
  source: retailer_adapter
