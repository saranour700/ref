contract:
  name: phase6_scores
  version: 1.0.0
  description: Calculate product scores and attach available external enrichment references

input:
  datasets:
    product_metadata:
      required:
        - external_id
        - source_retailer

    product_nutrition:
      optional: true

output:
  dataset: product_scores
  grain: one score/enrichment record per retailer product
  columns:
    - external_id
    - source_retailer
    - nutri_score
    - agribalyse_reference
    - score_confidence
    - enrichment_source
    - calculated_at

processing:
  does:
    - calculate_available_product_scores
    - attach_available_external_references
    - calculate_score_confidence
    - preserve_source_identifiers
    - preserve_missing_enrichment

  does_not:
    - modify_product_identity
    - create_product_groups
    - create_product_variants
    - invent_missing_scores
    - treat_scores_as_product_identity

quality:
  critical:
    - missing_external_id
    - missing_source_retailer
    - invalid_score_value

  warnings:
    - missing_nutrition_for_score
    - missing_external_reference
    - unavailable_score

failure_handling:
  statuses:
    PASS: continue
    WARNING: continue_and_report
    AMBIGUOUS: quarantine_for_review
    FAIL: stop

versioning:
  schema_version: 1.0.0
  rules_version: 1.0.0

lineage:
  source: phase5_nutrition
  pipeline_version: 1.0.0
