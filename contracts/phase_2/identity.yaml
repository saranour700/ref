contract:
  name: phase2_identity
  version: 1.0.0
  description: Build a standardized product identity representation from validated product data

input:
  dataset: validated_products
  required_columns:
    - external_id
    - source_retailer
    - brand
    - title

  optional_columns:
    - barcode
    - size_amount
    - size_unit
    - description
    - ingredients_text
    - nutrition_text
    - image_url
    - price
    - currency

output:
  dataset: standardized_products
  grain: one record per retailer product
  columns:
    - external_id
    - source_retailer
    - barcode
    - brand
    - title
    - product_name
    - identity_attributes
    - variant_attributes
    - size_amount
    - size_unit

processing:
  does:
    - standardize_product_fields
    - extract_product_name
    - identify_identity_attributes
    - separate_identity_attributes_from_variant_attributes
    - normalize_units
    - preserve_source_identifiers
    - generate_deterministic_identity_representation

  does_not:
    - classify_products
    - assign_taxonomy
    - create_product_groups
    - create_product_variants
    - merge_products
    - calculate_scores
    - invent_missing_values

quality:
  critical:
    - missing_external_id
    - missing_source_retailer
    - missing_product_identity

  warnings:
    - missing_brand
    - missing_barcode
    - missing_size
    - missing_optional_identity_attributes

  ambiguous:
    - ambiguous_identity
    - ambiguous_normalization

failure_handling:
  statuses:
    PASS: continue
    WARNING: continue_and_report
    AMBIGUOUS: quarantine_for_review
    FAIL: stop

ambiguity:
  signals:
    - missing_identity_evidence
    - conflicting_identity_attributes
    - competing_identity_candidates
    - semantic_uncertainty

  resume_from: phase_2

identifiers:
  primary_key:
    - source_retailer
    - external_id

  identity_hash:
    deterministic: true
    rules_versioned: true

versioning:
  schema_version: 1.0.0
  rules_version: 1.0.0

lineage:
  source: phase1_validation
  pipeline_version: 1.0.0
